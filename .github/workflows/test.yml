name: Run tests

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'info'
      tags:
        description: 'Description'
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  backend-test:
    name: Test Backend
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SERVER_NAME: localhost
      SERVER_HOST: http://localhost
      PROJECT_NAME: NumerBay
      SECRET_KEY: ci-only-secret-key
      FIRST_SUPERUSER: admin@numerbay.ai
      FIRST_SUPERUSER_PASSWORD: ci-only-superuser-password
      POSTGRES_SERVER: localhost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
      GCP_STORAGE_BUCKET: storage.test.numerbay.ai
    defaults:
      run:
        working-directory: backend/app
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set Up uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.10.10"

      - name: Install Dependencies
        run: uv sync --locked

      - name: Write GCP Credentials
        env:
          GCP_CREDENTIALS_JSON: ${{ secrets.APP_GCP_SERVICE_ACCOUNT_INFO }}
        run: |
          if [ -n "$GCP_CREDENTIALS_JSON" ]; then
            printf '%s' "$GCP_CREDENTIALS_JSON" > "$RUNNER_TEMP/gcp-service-account.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-service-account.json" >> "$GITHUB_ENV"
          fi

      - name: Bootstrap DB
        run: uv run bash bootstrap-db.sh

      - name: Test Backend
        run: uv run bash tests-start.sh
